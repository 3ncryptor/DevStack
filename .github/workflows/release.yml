# Publishes to npm when a version tag is pushed (buildPlan R.9, D-102). Trusted publishing:
# npm trusts this workflow over OIDC, so no token is stored and provenance is attached. The
# first publish (1.0.0) was manual; npm only allows a trusted publisher for an existing package.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Pinned to commits: this job can publish, so its actions must not change underneath it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm 11 (trusted publishing needs npm 11.5.1 or newer)
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The smoke test starts the CLI through pnpm dlx and bunx too
      - name: Install pnpm and bun
        run: npm install --global pnpm@10.26.2 bun@1.4.0

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Smoke-test the packed CLI
        run: npm run release:smoke

      # Skips a version already on npm, such as 1.0.0, which was published by hand
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "create-devstack-app@$version" version >/dev/null 2>&1; then
            echo "create-devstack-app@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish
